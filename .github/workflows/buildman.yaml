name: Build BGC A32 (Native Toolchain & Auto-TM Extract)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================================
  # 1. VERSİYON 1.3 (Klasik Amiga 500 / CDTV / Kickstart 1.3)
  # ==========================================================
  build-v1-3:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Yerel Amiga Derleyicisini ve Araçları Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y wget p7zip-full genisoimage make gcc-m68k-amigaos

      - name: v1.1 CD'sini İndir, CDTV.TM Ayıkla ve ISO'yu Sil
        run: |
          mkdir -p cd_root/S /tmp/extracted
          echo "==> v1.1 Developer CD indiriliyor..."
          wget -q -O /tmp/dev_cd_v1.iso "https://archive.org/download/amiga-developer-cd-v1_1/Amiga%20Developer%20CD%20v1.1%20-%20May%201996%20%281996%29%28Schatztruhe%29%5B%21%5D.iso"
          
          echo "==> CDTV.TM ayıklanıyor..."
          7z e /tmp/dev_cd_v1.iso -o/tmp/extracted "CDTV.TM" -r -y || true
          cp /tmp/extracted/CDTV.TM cd_root/ 2>/dev/null || true
          
          echo "==> Geçici ISO temizleniyor..."
          rm -rf /tmp/dev_cd_v1.iso /tmp/extracted

      - name: v1.3 / CDTV Binary Derle (68000 CPU)
        run: |
          m68k-amigaos-gcc -O2 -m68000 -noixemul -Wall Src/BGCA32.c -o cd_root/BGC_A32_V13 -s

      - name: v1.3 / CDTV Saf ISO İmajı Oluştur
        run: |
          genisoimage -o bgc_a32_v1.3_cdtv.iso -V "BGC_A32_V13" -J -r cd_root/

      - name: v1.3 Artifact Yükle (Sadece Hatasızsa)
        uses: actions/upload-artifact@v4
        with:
          name: bgc-a32-v1.3-cdtv-release
          path: |
            bgc_a32_v1.3_cdtv.iso
            cd_root/BGC_A32_V13

  # ==========================================================
  # 2. VERSİYON 2.1 / CD32 (Modern AmigaOS 2.1+ & CD32 AGA)
  # ==========================================================
  build-v2-1-cd32:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Yerel Amiga Derleyicisini ve Araçları Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git wget p7zip-full genisoimage make gcc-m68k-amigaos

      - name: v2.1 CD'sini İndir, CD32.TM Ayıkla ve ISO'yu Sil
        run: |
          mkdir -p cd_root/S /tmp/extracted
          echo "==> v2.1 Developer CD indiriliyor..."
          wget -q -O /tmp/dev_cd_v2.iso "https://archive.org/download/amigadevelopercdv2.1/Amiga%20Developer%20CD%20v2.1.iso"
          
          echo "==> CD32.TM ayıklanıyor..."
          7z e /tmp/dev_cd_v2.iso -o/tmp/extracted "CD32.TM" -r -y || true
          cp /tmp/extracted/CD32.TM cd_root/ 2>/dev/null || true
          
          echo "==> Geçici ISO temizleniyor..."
          rm -rf /tmp/dev_cd_v2.iso /tmp/extracted

      - name: CD32 Boot Araçlarını İndir (cd32tools)
        run: |
          git clone https://github.com/patrikaxelsson/cd32tools.git /tmp/cd32tools

      - name: v2.1 / CD32 Binary Derle (68000 / AmigaOS Hedefli)
        run: |
          m68k-amigaos-gcc -O2 -noixemul -Wall Src/BGCA32.c -o cd_root/BGC_A32_V21 -s

      - name: CD32 Bootable ISO İmajı Üret
        run: |
          if [ -f cd_root/CD32.TM ]; then
            python3 /tmp/cd32tools/iso/make_cd32_iso.py -t cd_root/CD32.TM -o bgc_a32_v2.1_cd32.iso cd_root/ || \
            python3 /tmp/cd32tools/iso/make_cd32_iso.py -o bgc_a32_v2.1_cd32.iso cd_root/
          else
            python3 /tmp/cd32tools/iso/make_cd32_iso.py -o bgc_a32_v2.1_cd32.iso cd_root/
          fi

      - name: v2.1 / CD32 Artifact Yükle (Sadece Hatasızsa)
        uses: actions/upload-artifact@v4
        with:
          name: bgc-a32-v2.1-cd32-release
          path: |
            bgc_a32_v2.1_cd32.iso
            cd_root/BGC_A32_V21
